name: bfv-netwerk

topology:
  nodes:
    node-a: 
      kind: linux
      image: alpine:latest
      binds:
        - config/node-a.sh:/tmp/setup.sh
      exec:
        - sh /tmp/setup.sh

    node-b: 
      kind: linux
      image: alpine:latest
      binds:
        - config/node-b.sh:/tmp/setup.sh
      exec:
        - sh /tmp/setup.sh

    lan-10:
      kind: linux
      image: alpine:latest
      binds:
        - config/lan-10.sh:/tmp/setup.sh
      exec:
        - sh /tmp/setup.sh

    node-c1:
      kind: linux
      image: alpine:latest
      binds:
        - config/node-c1.sh:/tmp/setup.sh
      exec:
        - sh /tmp/setup.sh

    node-c2:
      kind: linux
      image: alpine:latest
      binds:
        - config/node-c2.sh:/tmp/setup.sh
      exec:
        - sh /tmp/setup.sh

    node-c3:
      kind: linux
      image: alpine:latest
      binds:
        - config/node-c3.sh:/tmp/setup.sh
      exec:
        - sh /tmp/setup.sh

    AMS:
      kind: linux
      image: frrouting/frr:latest
      binds:
        - config/frr-daemons:/etc/frr/daemons
        - config/AMS-frr.conf:/etc/frr/frr.conf
      exec:
        - apk add --no-cache tcpdump

    UTR:
      kind: linux
      image: frrouting/frr:latest
      binds:
        - config/frr-daemons:/etc/frr/daemons
        - config/UTR-frr.conf:/etc/frr/frr.conf
      exec:
        - apk add --no-cache tcpdump

    DEV:
      kind: linux
      image: frrouting/frr:latest
      binds:
        - config/frr-daemons:/etc/frr/daemons
        - config/DEV-frr.conf:/etc/frr/frr.conf
      exec:
        - apk add --no-cache tcpdump

    APD:
      kind: linux
      image: frrouting/frr:latest
      binds:
        - config/frr-daemons:/etc/frr/daemons
        - config/APD-frr.conf:/etc/frr/frr.conf
      exec:
        - apk add --no-cache tcpdump

  links:
    - endpoints: ["node-a:eth1", "AMS:eth1"]
    - endpoints: ["AMS:eth2", "UTR:eth1"]
    - endpoints: ["UTR:eth2", "DEV:eth1"]
    - endpoints: ["DEV:eth2", "node-b:eth1"]
    - endpoints: ["UTR:eth3", "APD:eth1"]
    - endpoints: ["APD:eth2", "DEV:eth3"]
    - endpoints: ["UTR:eth4", "lan-10:eth1"]
    - endpoints: ["lan-10:eth2", "node-c1:eth1"]
    - endpoints: ["lan-10:eth3", "node-c2:eth1"]
    - endpoints: ["lan-10:eth4", "node-c3:eth1"]

    